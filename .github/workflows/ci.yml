name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: tipos, vet, testes e build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Go comes with the runner; go.mod's version line makes it fetch the exact toolchain.
      - name: Web — dependências, tipos e build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Go — formatação e vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: Banco de teste (papel de tenant, sem poder criar schema)
        env:
          PGPASSWORD: ci
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE app_draw_test LOGIN PASSWORD 'test'" \
            -c "CREATE SCHEMA draw_test AUTHORIZATION app_draw_test"
      - name: Go — testes (com Postgres)
        env:
          DRAW_TEST_DATABASE_URL: postgres://app_draw_test:test@127.0.0.1:5432/postgres
        run: go test -race ./...
      - name: Go — binário
        run: CGO_ENABLED=0 go build -trimpath -o bin/oute-draw ./cmd/oute-draw

  image-pr:
    name: imagem arm64 construída (PR, sem push)
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: QEMU (smoke da imagem arm64 em runner amd64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build do Dockerfile (sem push, carregado no daemon)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: ghcr.io/renatobardi/oute-draw:pr-check
          cache-from: type=gha
      - name: Smoke — imagem sobe e responde
        run: bash scripts/image-smoke.sh ghcr.io/renatobardi/oute-draw:pr-check

  image:
    name: imagem arm64 no GHCR
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: QEMU (smoke da imagem arm64 em runner amd64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login no GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push da imagem arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/renatobardi/oute-draw:latest
            ghcr.io/renatobardi/oute-draw:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke — imagem publicada sobe e responde
        run: bash scripts/image-smoke.sh "ghcr.io/renatobardi/oute-draw:sha-${{ github.sha }}"
